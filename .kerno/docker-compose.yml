services:
  postgres:
    image: "postgres:16-alpine"
    pull_policy: missing
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    environment:
      - "POSTGRES_USER=realworld_user"
      - "POSTGRES_PASSWORD=realworld_password"
      - "POSTGRES_DB=realworld_db"
    ports:
      - "5432"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U realworld_user -d realworld_db"
      interval: "3s"
      timeout: "5s"
      retries: "10"
    tmpfs:
      - /var/lib/postgresql/data
    labels:
      - external-url=postgresql://localhost:{{PORT}}/realworld_db?user=realworld_user&password=realworld_password

  sut:
    build:
      context: ${BUILD_CONTEXT}
      dockerfile_inline: |
        FROM node:20-slim

        WORKDIR /app

        # Install OpenSSL for Prisma
        RUN apt-get update && apt-get install -y openssl ca-certificates && rm -rf /var/lib/apt/lists/*

        # Copy all application files
        COPY . .

        # Expose application port
        EXPOSE 3000

        # Start the application - install, generate, build, migrate, and run
        CMD ["sh", "-c", "npm install --prefer-offline --no-audit --progress=false && npx prisma generate && npm run build && npx prisma migrate deploy && npm start"]
    volumes:
      - node_modules:/app/node_modules
    tmpfs:
      - /root/.npm:size=2G
      - /tmp:size=2G
      - /app/node_modules/@prisma/engines:size=500M
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3000"
    labels:
      - jwt-signing-config=HS256:${JWT_SECRET}

volumes:
  node_modules:
